name: BB84 finite alternative initial values on GC

on:
  push:
    branches:
      - research/bb84-paper-lp-gc-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[tests]'
      - name: Test alternative initial values, two optimizers and direct key rates
        run: |
          set -o pipefail
          python research/diagnose_bb84_alternative_starts.py | tee bb84_alternative_starts.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb84-alternatives-py${{ matrix.python-version }}
          path: bb84_alternative_starts.jsonl
