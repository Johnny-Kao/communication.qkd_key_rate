name: QKD v2.0.5 four-issue proof (research only)

on:
  push:
    branches:
      - research/qkd-v205-four-proof-gc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-issue-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package test dependencies
        run: python -m pip install -e '.[tests]'
      - name: Record baseline, interpreter, and exact dependencies
        run: |
          git rev-parse HEAD
          python --version
          python -m pip freeze | tee installed_dependencies.log
      - name: Run unmodified upstream native test suite
        run: |
          set +e
          python -m pytest -q | tee native_suite.log
          echo "${PIPESTATUS[0]}" > native_suite_rc.txt
          exit 0
      - name: Four issue independent proof and A/B experiment
        run: |
          set -o pipefail
          python research/four_issue_proof.py | tee four_issue_proof.log
      - name: Archive exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qkd-four-proof-py${{ matrix.python-version }}
          path: |
            installed_dependencies.log
            native_suite.log
            native_suite_rc.txt
            four_issue_proof.log
            four_issue_proof_results.json
          if-no-files-found: error
      - name: Report unmodified upstream test failure accurately
        if: always()
        run: |
          suite_rc=$(cat native_suite_rc.txt)
          echo "Official TNO v2.0.5 native suite exit code: $suite_rc" >> "$GITHUB_STEP_SUMMARY"
          if [ "$suite_rc" -ne 0 ]; then
            echo "Upstream native suite failed, even though independent research proof may have passed."
            exit 1
          fi
