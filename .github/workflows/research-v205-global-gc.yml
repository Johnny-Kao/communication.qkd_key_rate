name: QKD v2.0.5 one-shot global audit (research only)

on:
  push:
    branches:
      - research/qkd-v205-global-gc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install official-package dependencies
        run: python -m pip install -e '.[tests]'
      - name: Confirm version and tested commit
        run: |
          git log -1 --format='%H %s'
          python -c "from tno.quantum.communication.qkd_key_rate import __version__; print(__version__)"
      - name: Capture all dependency versions
        run: python -m pip freeze | tee installed_dependencies.log
      - name: Full native baseline tests (single run)
        run: |
          set +e
          python -m pytest -q | tee native_suite.log
          echo "${PIPESTATUS[0]}" > native_suite_rc.txt
          exit 0  # Never skip the research probes because native tests fail.
      - name: Repeat optimizer-sensitive BBM92 native test
        run: |
          set +e
          python -m pytest -q src/tno/quantum/communication/qkd_key_rate/test/classical/test_required_linktime.py | tee bbm92_repeat.log
          echo "${PIPESTATUS[0]}" > bbm92_repeat_rc.txt
          exit 0
      - name: Run all 17 existing anomaly probes
        run: |
          set -o pipefail
          python research/audit_v205_batch.py | tee audit_v205_batch.log
      - name: Run expanded cross-module invariant and A/B tests
        run: |
          set -o pipefail
          python research/audit_v205_crossmodule.py | tee crossmodule_v205.log
      - name: Attach complete candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qkd-v205-global-gc-py${{ matrix.python-version }}
          path: |
            audit_v205_results.json
            audit_v205_batch.log
            crossmodule_v205_results.json
            crossmodule_v205.log
            native_suite.log
            bbm92_repeat.log
            native_suite_rc.txt
            bbm92_repeat_rc.txt
            installed_dependencies.log
          if-no-files-found: warn
      - name: Set truthful final CI result from native test exit codes
        if: always()
        run: |
          native_rc=$(cat native_suite_rc.txt)
          bbm92_rc=$(cat bbm92_repeat_rc.txt)
          echo "Native complete suite exit code: $native_rc" >> "$GITHUB_STEP_SUMMARY"
          echo "Repeated BBM92 suite exit code: $bbm92_rc" >> "$GITHUB_STEP_SUMMARY"
          if [ "$native_rc" -ne 0 ] || [ "$bbm92_rc" -ne 0 ]; then
            echo 'Full test verification is NOT green even when all research probes execute.'
            exit 1
          fi
