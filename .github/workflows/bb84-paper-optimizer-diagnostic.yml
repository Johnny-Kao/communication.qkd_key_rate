name: BB84 finite optimizer differential diagnostic

on:
  push:
    branches:
      - research/bb84-paper-lp-gc-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[tests]'
      - name: Trace independent valid input grid against original optimizer
        run: |
          set -o pipefail
          python research/diagnose_bb84_finite_paper_optimizer.py | tee finite_bb84_diagnosis.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb84-finite-optimizer-py${{ matrix.python-version }}
          path: finite_bb84_diagnosis.jsonl
